spring.datasource.url=jdbc:h2:mem:siids_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

jwt.access-token.expiration=28800000
jwt.refresh-token.expiration=604800000

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.messaging.simp.broker.SimpleBrokerMessageHandler=WARN
logging.level.org.springframework.web.socket.config.WebSocketMessageBrokerStats=WARN
logging.level.org.springframework.web.SimpLogging=WARN
