<style>
        body {
            background-color: #F4F7FA;
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .login-card {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #D1D9E0;
        }
        .input-group:focus-within {
            border-left: 4px solid #003e80;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Main Container -->
<main class="w-full max-w-[480px]">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-container-padding login-card flex flex-col items-center">
<!-- RRA Logo Area -->
<div class="mb-margin-lg">
<div class="w-24 h-24 rounded-full border-2 border-primary-fixed flex items-center justify-center overflow-hidden bg-white">
<img alt="Rwanda Revenue Authority Logo" class="w-4/5 h-auto object-contain" data-alt="A clean professional studio photograph of the Rwanda Revenue Authority emblem, which features a colorful, stylized sun and waves icon above official text. The logo is perfectly centered within a minimalist white circle, surrounded by a thin, elegant blue ring. The lighting is high-key and soft, emphasizing a sense of transparency and governmental trust. The visual style is modern, corporate, and extremely clear." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCYcgPmaQQXOSaLIKPMB_Kk8JG368zrd2zW0qC9PsB1Oj1ljFsiNklKcBeOvUgn4lsFNH_GwWApqxiPF-faLdZDKQSDXP9bilWA-eb288U1HmoBp3DifmXX2aowfeOVGouydkkJiOykBPXOz5XBZQqgnIOdFrJZxRouiZNsozd2nn3LLXxjNnwWId0sR0vs_Zv_0hnw0zmBi0oqL9HHQykTv0wRhn58Eu0nTuPONbtP6n-IMOJ2QzzFBZLwpHo5Ci_AUTVkquW5ld4"/>
</div>
</div>
<!-- Heading Section -->
<div class="text-center mb-margin-lg space-y-1">
<h1 class="font-headline-sm text-headline-sm text-on-surface">
                    Strategic Intelligence &amp; Investigation Division System
                </h1>
<p class="font-label-md text-label-md text-primary font-bold">
                    (SIIDs)
                </p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<!-- User ID Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="user-id">
                        User ID <span class="text-error">*</span>
</label>
<div class="input-group relative flex items-center bg-surface-container-low border border-outline-variant rounded-lg transition-all">
<span class="material-symbols-outlined px-3 text-on-surface-variant" data-icon="person">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="user-id" placeholder="04219" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="password">
                        Password <span class="text-error">*</span>
</label>
<div class="input-group relative flex items-center bg-surface-container-low border border-outline-variant rounded-lg transition-all">
<span class="material-symbols-outlined px-3 text-on-surface-variant" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="px-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary-container transition-all cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-3.5 rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Login
                    </button>
</div>
<!-- Footer Link -->
<div class="text-center pt-2">
<a class="font-label-md text-label-md text-primary-container hover:underline decoration-2 transition-all" href="#">
                        Forgot password?
                    </a>
</div>
</form>
</div>
<!-- System Footer -->
<footer class="mt-margin-lg text-center space-y-2">
<p class="font-label-md text-label-md text-on-surface-variant opacity-70">
                © 2024 Rwanda Revenue Authority. Strategic Intelligence &amp; Investigation Division.
            </p>
<div class="flex justify-center gap-gutter text-on-surface-variant opacity-60">
<a class="font-label-md text-label-md hover:text-primary transition-colors" href="#">Legal Disclaimer</a>
<span class="text-outline-variant">|</span>
<a class="font-label-md text-label-md hover:text-primary transition-colors" href="#">Security Protocol</a>
</div>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        const passwordInput = document.getElementById('password');
        const toggleBtn = passwordInput.nextElementSibling;
        const iconSpan = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            iconSpan.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Add subtle focus animation to inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.input-group').classList.add('shadow-md');
            });
            input.addEventListener('blur', () => {
                input.closest('.input-group').classList.remove('shadow-md');
            });
        });
    </script>
</body></html>
